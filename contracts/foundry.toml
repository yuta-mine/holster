[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 700
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@1inch/swap-vm/=lib/swap-vm/",
  "@1inch/aqua/=lib/aqua/",
  "@1inch/solidity-utils/=lib/solidity-utils/",
  "solmate/=lib/v4-core/lib/solmate/",
]

# Same optimizer pipeline as the 1inch SwapVM release build, so the router fits under the 24 KB limit.
[profile.default.optimizer_details]
yul = true
yulDetails = { stackAllocation = true, optimizerSteps = "dhfoDgvulfnTUtnIf[xa[r]EscLMcCTUtTOntnfDIulLculVcul Tpeul]jmul[jul] VcTOcul jmul : fDnTOcmu" }

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
